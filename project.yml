name: BatSign
options:
  bundleIdPrefix: app.batsign
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""

targets:
  BatSign:
    type: application
    platform: iOS
    sources:
      - path: BatSign
        excludes:
          - "Info.plist"
      - path: Vendor/zsign/src
        excludes:
          - "zsign.cpp"
          - "third-party/minizip/iowin32.c"
          - "third-party/minizip/mztools.c"
      - path: Vendor/zsign/bridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.batsign.ios
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: BatSign/BatSign-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BatSign/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_C_LANGUAGE_STANDARD: c11
        HEADER_SEARCH_PATHS: >
          "$(SRCROOT)/Vendor/zsign/src"
          "$(SRCROOT)/Vendor/zsign/src/common"
          "$(SRCROOT)/Vendor/zsign/src/third-party/minizip"
          "$(SRCROOT)/Vendor/zsign/src/third-party/zlib"
          "$(SRCROOT)/Vendor/zsign/bridge"
          "$(SRCROOT)/Vendor/openssl/include"
          "$(SRCROOT)/Vendor/zstd/include"
        LIBRARY_SEARCH_PATHS: >
          "$(SRCROOT)/Vendor/openssl/lib"
          "$(SRCROOT)/Vendor/zstd/lib"
        OTHER_LDFLAGS: "-lcrypto -lz -lzstd"
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  BatSignTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BatSignTests
    dependencies:
      - target: BatSign

schemes:
  BatSign:
    build:
      targets:
        BatSign: release
    test:
      targets:
        - BatSignTests
    archive:
      config: Release
